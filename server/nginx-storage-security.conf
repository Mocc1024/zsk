# 上传目录安全配置（Nginx）
# 用法：在站点的 server 块中 include 本文件
#
#     server {
#         ...
#         include 路径/nginx-storage-security.conf;
#     }
#
# 目标：/storage 下的图片/视频/附件可直接访问，任何脚本文件不得被执行

location ^~ /storage/ {
    # 拒绝脚本类文件
    location ~* \.(php|php3|php4|php5|php7|phtml|phar)$ {
        deny all;
        return 404;
    }

    # 常见静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|webp|bmp|mp4|webm|mov|pdf|txt)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 目录列表关闭由 autoindex off 保证
    autoindex off;
}
